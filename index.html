<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1f">

    <!-- Static fallbacks: replaced at runtime with the values in locales/*.json -->
    <title>Rostyslav Terletskyy — Software Developer</title>
    <meta name="description" content="Portfolio of Rostyslav Terletskyy, junior software developer with experience in web development (TypeScript, Three.js) and game programming (Unity, Unreal Engine).">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rostyslav Terletskyy — Software Developer">
    <meta property="og:description" content="Portfolio of Rostyslav Terletskyy, junior software developer with experience in web development (TypeScript, Three.js) and game programming (Unity, Unreal Engine).">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1f'/%3E%3Cpath d='M24 20 12 32l12 12M40 20l12 12-12 12' fill='none' stroke='%23a855f7' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <!-- Icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles: main.css only @imports the other CSS files -->
    <link rel="stylesheet" href="css/main.css">

    <!-- EmailJS SDK (used by js/sections/contact.js) -->
    <script defer src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <!-- App entry point (ES modules) -->
    <script type="module" src="js/main.js"></script>
</head>

<body class="is-loading">

    <!-- Only visible if the app fails to start: JS disabled, blocked, or index.html opened straight from disk -->
    <div class="boot-error" role="alert">
        <p>
            <strong>The site could not load.</strong><br>
            Please enable JavaScript. If you opened this file directly from your computer, serve the folder
            with a local web server instead (for example the VS Code "Live Server" extension).
            The browser console (F12) shows the exact error.
        </p>
    </div>

    <!-- Background particles (filled by js/effects/particles.js) -->
    <div class="particles" aria-hidden="true"></div>


    <!-- =========================================
         NAVIGATION
         ========================================= -->
    <nav class="navbar" aria-label="Main">
        <div class="container navbar__inner">
            <a href="#home" class="navbar__logo">&lt;/Programmer&gt;</a>

            <button class="navbar__toggle" type="button" aria-expanded="false" aria-controls="nav-links"
                    data-i18n-attr="aria-label:nav.menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>

            <ul class="navbar__links" id="nav-links">
                <li><a href="#home" class="navbar__link" data-i18n="nav.home"></a></li>
                <li><a href="#about" class="navbar__link" data-i18n="nav.about"></a></li>
                <li><a href="#skills" class="navbar__link" data-i18n="nav.skills"></a></li>
                <li><a href="#projects" class="navbar__link" data-i18n="nav.projects"></a></li>
                <li><a href="#contact" class="navbar__link" data-i18n="nav.contact"></a></li>
                <!-- Language dropdown is built by js/sections/language-switcher.js -->
                <li class="navbar__lang" id="lang-switcher"></li>
            </ul>
        </div>
    </nav>


    <main>

        <!-- =========================================
             HERO
             ========================================= -->
        <section id="home" class="hero">
            <div class="container hero__grid">

                <div class="hero__content">
                    <h1 class="hero__name">Rostyslav Terletskyy</h1>

                    <p class="hero__subtitle">
                        <span class="typing-text" id="typing-text"></span><span class="typing-cursor" aria-hidden="true">|</span>
                    </p>

                    <p class="hero__description" data-i18n="hero.description"></p>

                    <div class="hero__actions">
                        <a href="#projects" class="btn btn--primary" data-i18n="hero.viewWork"></a>
                        <!-- Resume dropdown: built from data/site.json -->
                        <div class="dropdown" id="resume-dropdown"></div>
                        <!-- Social icon buttons: built from data/site.json -->
                        <div class="hero__social" id="hero-social"></div>
                    </div>
                </div>

                <div class="hero__visual">
                    <!-- Video reel: built from the projects flagged "inReel" in data/projects.json -->
                    <div class="reel" id="hero-reel"></div>
                </div>

            </div>
        </section>


        <!-- =========================================
             ABOUT
             ========================================= -->
        <section id="about">
            <div class="container">
                <div class="section-header reveal">
                    <h2 class="section-title" data-i18n="about.title"></h2>
                </div>

                <div class="about-grid">
                    <div class="about-text reveal">
                        <p class="about-lead" data-i18n="about.lead"></p>
                        <p data-i18n="about.p1"></p>
                        <p data-i18n="about.p2"></p>
                        <p data-i18n="about.p3"></p>

                        <!-- Quick facts for recruiters: texts are in locales/*.json (about.*) -->
                        <ul class="about-facts">
                            <li class="about-fact">
                                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                                <span><strong data-i18n="about.availabilityLabel"></strong> <span data-i18n="about.availability"></span></span>
                            </li>
                            <li class="about-fact">
                                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                                <span><strong data-i18n="about.locationLabel"></strong> <span data-i18n="about.location"></span></span>
                            </li>
                            <li class="about-fact">
                                <i class="fa-solid fa-language" aria-hidden="true"></i>
                                <span><strong data-i18n="about.languagesLabel"></strong> <span data-i18n="about.languages"></span></span>
                            </li>
                            <li class="about-fact">
                                <i class="fa-solid fa-heart" aria-hidden="true"></i>
                                <span><strong data-i18n="about.interestsLabel"></strong> <span data-i18n="about.interests"></span></span>
                            </li>
                        </ul>
                    </div>

                    <aside class="about-journey reveal">
                        <h3 class="about-journey__title">
                            <i class="fa-solid fa-route" aria-hidden="true"></i>
                            <span data-i18n="about.journeyTitle"></span>
                        </h3>
                        <!-- Built from data/timeline.json -->
                        <ol class="timeline" id="timeline"></ol>
                    </aside>
                </div>
            </div>
        </section>


        <!-- =========================================
             TECH STACK
             ========================================= -->
        <section id="skills">
            <div class="container">
                <div class="section-header reveal">
                    <h2 class="section-title" data-i18n="skills.title"></h2>
                    <p class="section-subtitle" data-i18n="skills.subtitle"></p>
                </div>

                <!-- Built from data/skills.json -->
                <div class="skills-grid reveal" id="skills-grid"></div>
            </div>
        </section>


        <!-- =========================================
             PROJECTS
             ========================================= -->
        <section id="projects">
            <div class="container">
                <div class="section-header reveal">
                    <h2 class="section-title" data-i18n="projects.title"></h2>
                    <p class="section-subtitle" data-i18n="projects.subtitle"></p>
                </div>

                <div class="project-explorer reveal">
                    <!-- Everything below is built from data/projects.json -->
                    <div class="tabs" id="project-tabs" data-i18n-attr="aria-label:projects.tabsLabel"></div>
                    <p class="project-explorer__description" id="project-description"></p>
                    <div class="project-filter" id="project-filter" hidden></div>
                    <div class="projects-grid" id="projects-grid" role="tabpanel"></div>
                    <p class="projects-empty" id="projects-empty" hidden></p>
                </div>
            </div>
        </section>


        <!-- =========================================
             CONTACT
             ========================================= -->
        <section id="contact" class="contact">
            <div class="container">
                <div class="section-header reveal">
                    <h2 class="section-title" data-i18n="contact.title"></h2>
                </div>

                <div class="contact__content reveal">
                    <p class="contact__text" data-i18n="contact.description"></p>

                    <!-- Built from the entries of data/site.json -> social that have "contact": true -->
                    <div class="contact__links" id="contact-links" hidden></div>

                    <!-- Field names (from_name, reply_to, message) match the EmailJS template variables -->
                    <form id="contact-form" class="form">
                        <div class="form__field">
                            <input type="text" id="name" name="from_name" placeholder=" " autocomplete="name" required>
                            <label for="name" data-i18n="contact.name"></label>
                        </div>
                        <div class="form__field">
                            <input type="email" id="email" name="reply_to" placeholder=" " autocomplete="email" required>
                            <label for="email" data-i18n="contact.email"></label>
                        </div>
                        <div class="form__field">
                            <textarea id="message" name="message" placeholder=" " required></textarea>
                            <label for="message" data-i18n="contact.message"></label>
                        </div>

                        <button type="submit" class="btn btn--primary form__submit">
                            <span class="form__submit-label" data-i18n="contact.send"></span>
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                        </button>

                        <p class="form__status" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>

    </main>


    <footer class="footer">
        <div class="container">
            <p data-i18n="footer.rights"></p>
        </div>
    </footer>

</body>

</html>
